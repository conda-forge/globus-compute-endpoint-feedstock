schema_version: 1

context:
  name: globus-compute-endpoint
  version: 4.18.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: c6731783b7b82950c6b6f4f3375475fd0cc12b6543dc7cb9d2c78baeb8b1c1a9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - globus-compute-endpoint=globus_compute_endpoint.cli:cli_run

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - click-option-group >=0.5.6,<1
    - python >=${{ python_min }}
    - globus-sdk
    - globus-compute-sdk ==4.18.0
    - globus-identity-mapping ==0.5.0
    - psutil >5.9,<8
    - python-daemon >=2,<3
    - click >=8.3.3,<8.4.0
    - click-option-group >=0.5.6,<1
    - pyzmq >=26,<=28
    - parsl >=2026.7.27
    - pyprctl <0.2.0
    - setproctitle >=1.3.2,<1.4
    - pyyaml >=6.0,<7.0
    - jinja2 >=3.1.6,<3.2
    - jsonschema >=4.22,<5
    - cachetools >=6
    - types-cachetools >=6.0.0.20250525
    - cryptography >=50
tests:
  - python:
      imports:
        - globus_compute_endpoint
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
      - globus-compute-endpoint --help

about:
  summary: 'Globus Compute: High Performance Function Serving for Science'
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/globus/globus-compute

extra:
  recipe-maintainers:
    - WardLT
    - jan-janssen
    - conda-forge/globus-compute-sdk
